[cmd.help]
desc = "Shows all commands you can use"
[cmd.config]
desc = "Server settings of the bot"
[cmd.config.language]
desc = "Sets the language of the bot on this server"
[cmd.config.timezone]
desc = "Sets the time zone of this server (for schedules and times)"
[cmd.arg.language]
desc = "The language"
[cmd.arg.timezone]
desc = "IANA time zone, e.g. Europe/Zurich"

[help]
title = "GG-Bot – Commands"
footer = "{count} commands available to you"
empty = "There are no commands you can use here."

[config]
language_set = "Language set to **{language}**."
timezone_set = "Time zone set to **{name}**."

[cmd.warn]
desc = "Warns a member"
[cmd.unwarn]
desc = "Removes a warning from the escalation count"
[cmd.timeout]
desc = "Times a member out"
[cmd.untimeout]
desc = "Ends a member's timeout"
[cmd.kick]
desc = "Kicks a member"
[cmd.ban]
desc = "Bans a user"
[cmd.unban]
desc = "Unbans a user"
[cmd.tempban]
desc = "Bans a user for a limited time"
[cmd.softban]
desc = "Bans and immediately unbans a user to delete their messages"
[cmd.case]
desc = "Shows a moderation case"
[cmd.history]
desc = "Shows the moderation history of a user"
[cmd.note]
desc = "Private moderator notes about users"
[cmd.note.add]
desc = "Adds a note to a user"
[cmd.note.list]
desc = "Lists the notes about a user"
[cmd.note.remove]
desc = "Removes a note"
[cmd.purge]
desc = "Deletes recent messages, optionally filtered"
[cmd.slowmode]
desc = "Sets the slowmode of a channel"
[cmd.lock]
desc = "Locks a channel for everyone"
[cmd.unlock]
desc = "Unlocks a channel locked with /lock"
[cmd.modconfig]
desc = "Moderation settings"
[cmd.modconfig.escalation]
desc = "Automatic actions at a number of warnings"
[cmd.modconfig.escalation.add]
desc = "Adds or replaces an escalation rule"
[cmd.modconfig.escalation.remove]
desc = "Removes an escalation rule"
[cmd.modconfig.escalation.list]
desc = "Lists the escalation rules"
[cmd.modconfig.warn_expiry]
desc = "Sets after how many days warnings stop counting"
[cmd.modconfig.dm]
desc = "Sets whether affected users get a direct message"

[cmd.arg.user]
desc = "The user"
[cmd.arg.member]
desc = "The member"
[cmd.arg.reason]
desc = "The reason (optional)"
[cmd.arg.duration]
desc = "How long, e.g. 30m, 2h, 1d12h"
[cmd.arg.delete_days]
desc = "Delete this many days of their messages (0-7)"
[cmd.arg.case_no]
desc = "The case number"
[cmd.arg.page]
desc = "The page"
[cmd.arg.text]
desc = "The note text"
[cmd.arg.note_id]
desc = "The note ID"
[cmd.arg.amount]
desc = "How many messages to delete"
[cmd.arg.author]
desc = "Only messages from this user"
[cmd.arg.contains]
desc = "Only messages containing this text"
[cmd.arg.bots]
desc = "Only messages from bots"
[cmd.arg.attachments]
desc = "Only messages with attachments"
[cmd.arg.links]
desc = "Only messages with links"
[cmd.arg.embeds]
desc = "Only messages with embeds"
[cmd.arg.seconds]
desc = "Seconds between messages per member (0 = off)"
[cmd.arg.channel]
desc = "The channel (default: this one)"
[cmd.arg.warns]
desc = "Number of active warnings"
[cmd.arg.action]
desc = "What to do"
[cmd.arg.days]
desc = "Number of days"
[cmd.arg.enabled]
desc = "On or off"

