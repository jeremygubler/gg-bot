server {
    # Unprivilegierter nginx: darf keinen Port unter 1024 öffnen. Compose bildet WEB_PORT darauf ab.
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Die API-Bodies (Einstellungen) sind klein; alles Grössere ist ein Fehler oder Missbrauch.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Der Metrik-Endpunkt ist für Prometheus im Compose-Netz gedacht, nicht fürs Internet.
    location ^~ /api/metrics {
        return 404;
    }

    location /api/ {
        # Präfix /api wird entfernt; die API kennt ihn nicht. Sicherheitsköpfe setzt die API selbst.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dateinamen mit Hash: darf der Browser ewig behalten.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        # Die Einstiegsseite nie lange cachen, sonst bleiben Nutzer auf alten Skripten hängen.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
