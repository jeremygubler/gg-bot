# Wird in jede Location eingebunden, die selbst add_header benutzt (nginx erbt add_header sonst nicht).
# Das Dashboard lädt nur eigene Skripte und Stile; Bilder kommen von sich selbst, aus Blobs (Vorschau)
# und von Discords CDN (Avatare). HSTS gehört an den TLS-beendenden Proxy davor, nicht hierher.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://cdn.discordapp.com; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
