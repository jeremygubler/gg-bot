[project]
name = "gg-bot"
version = "0.1.0"
description = "Selbst gehosteter Discord-Bot als MEE6-Ersatz"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=6.0",
    "structlog>=24.1",
    "google-re2>=1.1.20251105",
]

[project.optional-dependencies]
bot = ["discord.py>=2.4"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "TID", "S", "T20", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "TID251"]
"src/ggbot/bot/**" = ["TID251"]
"src/ggbot/api/**" = ["TID251"]

# Import-Grenzen aus docs/ARCHITECTURE.md: core kennt weder discord noch fastapi.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"discord".msg = "ggbot.core darf discord.py nicht importieren (siehe docs/ARCHITECTURE.md)"
"fastapi".msg = "ggbot.core darf FastAPI nicht importieren (siehe docs/ARCHITECTURE.md)"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "ggbot.core.*"
strict = true

[[tool.mypy.overrides]]
module = "re2"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # discord.py importiert audioop (Voice); wir nutzen keine Voice-Wiedergabe.
    "ignore:.*audioop.*:DeprecationWarning",
]
