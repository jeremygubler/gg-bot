name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ggbot
          POSTGRES_PASSWORD: ggbot
          POSTGRES_DB: ggbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ggbot" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      GGBOT_TEST_DATABASE_URL: postgresql+asyncpg://ggbot:ggbot@localhost:5432/ggbot_test
      GGBOT_TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://ggbot:ggbot@localhost:5432/ggbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrationen (upgrade → downgrade → upgrade, Modelle == Schema)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env aus dem Beispiel
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci-only" >> .env
          echo "METRICS_TOKEN=ci-metrics-token" >> .env
      - name: Images bauen und Dienste hochfahren (ohne Bot, der braucht einen echten Token)
        run: docker compose up -d --build --wait postgres redis migrate api web
      - name: Bot-Image kann alle Cogs importieren (z. B. die native RE2-Bibliothek)
        run: |
          docker compose run --rm --no-deps --build bot python -c \
            "import importlib, re2; from ggbot.bot.client import COGS; [importlib.import_module(c) for c in COGS]; print(len(COGS), 'Cogs ok')"
      - name: API über nginx erreichbar
        run: |
          curl -fsS http://localhost:8080/api/healthz
      - name: Sicherheitsköpfe, gesperrter Metrik-Weg, keine Root-Prozesse
        run: |
          headers="$(curl -sS -D - -o /dev/null http://localhost:8080/)"
          echo "$headers" | grep -i "^content-security-policy: default-src 'none'"
          echo "$headers" | grep -i "^x-frame-options: DENY"
          curl -sS -D - -o /dev/null http://localhost:8080/api/healthz | grep -i "^cache-control: no-store"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics)" = 404
          for service in web api; do
            test "$(docker compose exec -T $service id -u)" != 0
          done
      - name: Metriken im Compose-Netz (mit Token) und ohne Token gesperrt
        run: |
          docker compose exec -T api python - <<'PY'
          import os, urllib.request, urllib.error
          def get(token):
              request = urllib.request.Request("http://127.0.0.1:8000/metrics")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              return urllib.request.urlopen(request, timeout=5)
          body = get(os.environ["METRICS_TOKEN"]).read().decode()
          assert "gg_db_up 1" in body and "gg_redis_up 1" in body, body
          try:
              get(None)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise SystemExit("ohne Token erreichbar")
          PY
      - name: Backup und Restore auf dem laufenden Stack
        env:
          START_CMD: docker compose up -d --wait migrate api
        run: |
          file="$(scripts/backup.sh)"
          test -s "$file"
          scripts/restore.sh --yes "$file"
          curl -fsS http://localhost:8080/api/healthz
      - if: failure()
        run: docker compose logs --no-color
