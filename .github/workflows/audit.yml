name: Audit

# Neue Sicherheitslücken in Abhängigkeiten tauchen ohne jeden Commit auf: darum auch wöchentlich.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Laufzeit-Abhängigkeiten gegen bekannte Lücken prüfen
        run: |
          uv export --frozen --no-dev --all-extras --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --no-deps

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Alle Abhängigkeiten (auch Werkzeuge) prüfen
        run: npm audit --audit-level=high
